<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Synthetic industrial asset analytics</title><desc id="desc">Accepted asset and maintenance totals, cost by plant, and data quality exclusions. All values are simulated.</desc><rect width="1200" height="710" fill="#F5F7FA"/><text x="48" y="51" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#087F8C">EAM / MASTER DATA / MAINTENANCE</text><text x="48" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#10243A">Industrial asset analytics</text><text x="48" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#10243A">Synthetic case study · Calendar year 2025 · EUR</text><rect x="48" y="163" width="264" height="108" rx="10" fill="white"/><text x="66" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#10243A">Accepted assets</text><text x="66" y="241" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#087F8C">176</text><rect x="328" y="163" width="264" height="108" rx="10" fill="white"/><text x="346" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#10243A">Accepted work orders</text><text x="346" y="241" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#087F8C">587</text><rect x="608" y="163" width="264" height="108" rx="10" fill="white"/><text x="626" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#10243A">Maintenance cost</text><text x="626" y="241" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#087F8C">EUR 561,115</text><rect x="888" y="163" width="264" height="108" rx="10" fill="white"/><text x="906" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#10243A">Corrective cost share</text><text x="906" y="241" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#087F8C">69.1%</text><text x="48" y="322" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#10243A">Maintenance cost by plant</text><text x="48" y="373" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">SOUTH</text><rect x="135" y="350" width="640" height="30" rx="4" fill="#087F8C"/><text x="785" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">EUR 191,108</text><text x="48" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">EAST</text><rect x="135" y="412" width="621" height="30" rx="4" fill="#087F8C"/><text x="766" y="434" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">EUR 185,484</text><text x="48" y="497" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">NORTH</text><rect x="135" y="474" width="618" height="30" rx="4" fill="#087F8C"/><text x="763" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">EUR 184,523</text><rect x="935" y="309" width="215" height="229" rx="10" fill="#10243A"/><text x="952" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Data quality holds</text><text x="952" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#E9B44C">13 asset rows</text><text x="952" y="422" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#E9B44C">17 event rows</text><text x="952" y="463" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="white">Excluded from KPI scope</text><text x="952" y="494" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="white">Every hold is traceable</text><text x="48" y="594" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#10243A">What this demonstrates</text><text x="48" y="629" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#10243A">Canonical keys → quarantine and stewardship → SQL KPIs → business review</text><text x="48" y="673" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#10243A">Illustrative outputs only. No company data, validated savings or operational recommendations.</text></svg>